<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/site :: head('Search | Spark Mart')}"></head>
<body>
<header th:replace="~{fragments/site :: header}"></header>
<main class="page">
    <section class="page-heading">
        <div>
            <h1>Search</h1>
            <p>Find catalog products or request an on-demand AI suggested item.</p>
        </div>
        <form th:action="@{/search}" method="get" class="search-panel">
            <input name="q" type="search" placeholder="Search grocery, skincare, clothing, devices" th:value="${query}">
            <select name="sort">
                <option value="">Newest</option>
                <option value="priceAsc" th:selected="${sort == 'priceAsc'}">Price low to high</option>
                <option value="priceDesc" th:selected="${sort == 'priceDesc'}">Price high to low</option>
                <option value="rating" th:selected="${sort == 'rating'}">Top rated</option>
            </select>
            <button type="submit">Search</button>
        </form>
    </section>

    <div class="product-grid" th:if="${!#lists.isEmpty(products)}">
        <th:block th:each="product : ${products}">
            <article th:replace="~{fragments/product-card :: card(${product})}"></article>
        </th:block>
    </div>

    <section class="ai-suggestion" th:if="${aiSuggestion != null}">
        <div>
            <span class="category-pill">AI Suggested Item</span>
            <h2 th:text="${aiSuggestion.name}">Suggestion</h2>
            <p th:text="${aiSuggestion.description}">Generated item</p>
        </div>
        <article th:replace="~{fragments/product-card :: card(${aiSuggestion})}"></article>
    </section>
    <p class="empty-state" th:if="${query != null && !query.isBlank() && #lists.isEmpty(products) && aiSuggestion == null}">
        No products found.
    </p>
</main>
<div th:replace="~{fragments/site :: cartFab}"></div>
<footer th:replace="~{fragments/site :: footer}"></footer>
<script th:replace="~{fragments/site :: scripts}"></script>
</body>
</html>
