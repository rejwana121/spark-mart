<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin :: head('Customers | Spark Mart Admin')}"></head>
<body class="admin-body">
<aside th:replace="~{fragments/admin :: sidebar}"></aside>
<main class="admin-main">
    <div class="admin-title"><div><h1>Customer / User Management</h1><p>Registered Spark Mart customers.</p></div></div>
    <div class="table-wrap">
        <table><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Joined</th></tr></thead>
        <tbody><tr th:each="customer : ${customers}">
            <td data-label="ID" th:text="${customer.id}">1</td>
            <td data-label="Name" th:text="${customer.name}">Name</td>
            <td data-label="Email" th:text="${customer.email}">Email</td>
            <td data-label="Joined" th:text="${#temporals.format(customer.createdAt, 'dd MMM yyyy HH:mm')}">Date</td>
        </tr></tbody></table>
    </div>
</main>
</body>
</html>
