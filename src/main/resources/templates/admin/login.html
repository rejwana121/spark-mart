<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin :: head('Admin Login | Spark Mart')}"></head>
<body class="login-page">
<main class="login-panel professional-auth-card">
    <a class="brand" th:href="@{/}">
        <span class="brand-mark">S</span>
        <span>Spark Mart</span>
    </a>
    <span class="auth-badge"><i class="fa-solid fa-shield-halved"></i> Admin</span>
    <h1>Admin Login</h1>
    <p>Secure access for administrators only.</p>
    <p class="alert" th:if="${error}" th:text="${error}">Error</p>
    <form th:action="@{/admin/login}" method="post" class="stacked-form">
        <label><span><i class="fa-regular fa-user"></i> Username</span><input name="username" type="text" autocomplete="username" required></label>
        <label><span><i class="fa-solid fa-lock"></i> Password</span><input name="password" type="password" autocomplete="current-password" required></label>
        <button class="button primary wide" type="submit"><i class="fa-solid fa-right-to-bracket"></i><span>Admin Login</span></button>
    </form>
</main>
</body>
</html>
