spring.application.name=spark_mart
server.servlet.session.timeout=30m
spring.thymeleaf.cache=false
sparkmart.admin.username=${SPARKMART_ADMIN_USERNAME:admin@sparkmart.com}
sparkmart.admin.password=${SPARKMART_ADMIN_PASSWORD:admin123}
server.port=8081
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:sparkmart}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Virtual Threads (Chapter 3)
spring.threads.virtual.enabled=true

# Flyway (Chapter 4.4): manages new schema changes going forward.
# baseline-on-migrate lets Flyway adopt an existing, non-empty database
# (one that Hibernate already created/updated) without erroring, then
# apply only the migrations that come after the baseline.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Observability (Chapter 7.1)
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=when-authorized
