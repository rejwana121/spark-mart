services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: sparkmart
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - sparkmart_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8081:8081"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: sparkmart
      DB_USERNAME: root
      DB_PASSWORD: root
      SPARKMART_ADMIN_USERNAME: admin@sparkmart.com
      SPARKMART_ADMIN_PASSWORD: admin123
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  sparkmart_mysql_data:
